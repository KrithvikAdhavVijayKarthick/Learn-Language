<title>Daily Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: a sticky top bar (Day picker + Quiz) over one content area. Lessons read as a ruled table on wide screens and stack into cards on phones. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --ink: #12223A;
  --muted: #5B6882;
  --line: #D9DEE8;
  --accent: #2D3FB8;
  --accent-ink: #FFFFFF;
  --soft: #E6EAFA;
  --good: #1C7A45;
  --good-bg: #E3F4EA;
  --bad: #B3261E;
  --bad-bg: #FBE7E5;
  --en: #2D3FB8;
  --ta: #B3261E;
  --fr: #1B6FA8;
  --hi: #A85F08;
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ta: "Noto Sans Tamil", "Figtree", system-ui, sans-serif;
  --font-hi: "Noto Sans Devanagari", "Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1422; --surface: #151E31; --ink: #E8ECF5; --muted: #9AA6BF; --line: #26324A;
    --accent: #8E9BFF; --accent-ink: #0D1422; --soft: #1E2A4A;
    --good: #6FD39A; --good-bg: #153326; --bad: #FF8F86; --bad-bg: #3A1B1B;
    --en: #9BA7FF; --ta: #FF8F86; --fr: #6DB7EE; --hi: #F0A64A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1422; --surface: #151E31; --ink: #E8ECF5; --muted: #9AA6BF; --line: #26324A;
  --accent: #8E9BFF; --accent-ink: #0D1422; --soft: #1E2A4A;
  --good: #6FD39A; --good-bg: #153326; --bad: #FF8F86; --bad-bg: #3A1B1B;
  --en: #9BA7FF; --ta: #FF8F86; --fr: #6DB7EE; --hi: #F0A64A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 24px; padding-top: 24px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topin { max-width: 1080px; margin: 0 auto; position: relative; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; margin-right: auto; }
.pill {
  cursor: pointer; border: 1.5px solid var(--accent); color: var(--accent); background: transparent;
  padding: 8px 16px; border-radius: 999px; min-height: 42px; font-weight: 600; font-size: 15px;
}
.pill:hover { background: var(--soft); }
.pill.solid, .pill[aria-pressed="true"], .pill[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.pill:focus-visible, .spk:focus-visible, .dbtn:focus-visible, .opt:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 25;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  max-height: min(65vh, 560px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.panel h3 { margin: 0 0 4px; font-size: 14px; }
.panel p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.dbtn {
  cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 4px;
  display: grid; gap: 0; justify-items: center; min-height: 56px; min-width: 0;
}
.dbtn b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.dbtn small { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbtn.has { background: var(--soft); border-color: transparent; }
.dbtn.has small { color: var(--accent); font-weight: 600; }
.dbtn.none { color: var(--muted); }
.dbtn[aria-current="true"] { outline: 2px solid var(--accent); }

h1 { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0 0 12px; text-wrap: balance; }
.kicker { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { margin: 0; color: var(--muted); max-width: 62ch; }
header.hd { display: grid; gap: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.voices { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.chip.off { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }

/* lesson table */
.sheet { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 2.6rem 1.15fr .8fr 1.2fr 1.2fr 1.2fr; gap: 0 12px; padding: 14px 16px; align-items: center; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.head { background: var(--soft); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; padding-block: 10px; }
.head span:nth-child(2) { color: var(--en); } .head span:nth-child(4) { color: var(--ta); }
.head span:nth-child(5) { color: var(--fr); } .head span:nth-child(6) { color: var(--hi); }
.sl { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.cell { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; min-width: 0; }
.cell::before { content: attr(data-label); grid-column: 1 / -1; display: none; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.cell[data-k="en"]::before { color: var(--en); } .cell[data-k="ta"]::before { color: var(--ta); }
.cell[data-k="fr"]::before { color: var(--fr); } .cell[data-k="hi"]::before { color: var(--hi); }
.txt { min-width: 0; overflow-wrap: anywhere; }
.w { font-weight: 600; font-size: 1.05rem; line-height: 1.3; }
.p { font-size: 13.5px; color: var(--muted); }
[lang="ta"] .w, [lang="ta"].big { font-family: var(--font-ta); }
[lang="hi"] .w, [lang="hi"].big { font-family: var(--font-hi); }
.syl { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.syl b { color: var(--ink); font-weight: 600; }
.spk { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; flex: none; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
.spk:hover { background: var(--accent); color: var(--accent-ink); }
.spk svg { width: 20px; height: 20px; }
.spk.playing { background: var(--accent); color: var(--accent-ink); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .spk.playing { animation: none; } }

.sentences { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.sent { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; align-items: start; min-width: 0; }
.sent .lab { grid-column: 1 / -1; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
.sent .w { font-weight: 500; }
.sent .m { color: var(--muted); font-size: 14px; }
.en-c { color: var(--en); } .ta-c { color: var(--ta); } .fr-c { color: var(--fr); } .hi-c { color: var(--hi); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* quiz */
.setup { display: grid; gap: 18px; }
.group { display: grid; gap: 8px; }
.group > .lbl { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
select { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; max-width: 100%; }
.qcard { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px; display: grid; gap: 12px; min-width: 0; margin: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.qmeta .tag { padding: 3px 10px; border-radius: 999px; background: var(--soft); }
.qprompt { font-size: 1.05rem; font-weight: 500; }
.big { display: inline-block; font-size: 1.7rem; font-weight: 600; line-height: 1.25; margin-right: 10px; vertical-align: middle; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--soft); }
.opt input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
input[type="text"] { width: 100%; max-width: 360px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.mrows { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; }
.mrow .big { font-size: 1.25rem; }
.score { font-family: var(--font-display); font-size: clamp(2.6rem, 10vw, 4rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.langs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.lscore { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.lscore b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.meter { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.rev { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.rev.ok { background: var(--good-bg); border-color: transparent; }
.rev.no { background: var(--bad-bg); border-color: transparent; }
.rev .st { font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.rev.ok .st { color: var(--good); } .rev.no .st { color: var(--bad); }
.rev .ex { color: var(--muted); font-size: 14.5px; }
ul.tips { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 520px; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 40; }

@media (max-width: 860px) {
  .head { display: none; }
  .row { grid-template-columns: 2rem 1fr; gap: 14px 10px; padding: 16px; align-items: start; }
  .row > .cell, .row > .syl { grid-column: 2; }
  .row > .sl { grid-column: 1; grid-row: 1; }
  .cell::before { display: block; }
  .syl::before { content: "Syllables"; display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
}
</style>

<div class="top">
  <div class="topin">
    <div class="brand">Daily Words</div>
    <button class="pill" id="pickBtn" type="button" aria-expanded="false" aria-controls="pickPanel">Day 1 · School ▾</button>
    <button class="pill" id="quizBtn" type="button">Quiz</button>
    <div class="panel" id="pickPanel" hidden>
      <h3>Choose a day</h3>
      <p id="pickNote"></p>
      <div class="days" id="days"></div>
    </div>
  </div>
</div>

<div class="wrap" id="view"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  }
};

function usedSet() { var s = {}; try { var a = JSON.parse(store("dw_used") || "[]"); a.forEach(function (k) { s[k] = 1; }); } catch (e) {} return s; }
function buildQuiz(level, dayList) {
  var pool = []; dayList.forEach(function (d) { DAYS[d].words.forEach(function (w) { pool.push(w); }); });
  var used = usedSet(), inQuiz = {}, qs = [];
  PLANS[level].forEach(function (pl) {
    var L = pl[0], type = pl[1];
    var cands = pool.filter(function (w) { return !inQuiz[L + w.en] && (type !== "unscramble" || w.en.length >= 4); });
    if (!cands.length) cands = pool.filter(function (w) { return type !== "unscramble" || w.en.length >= 4; });
    var fresh = cands.filter(function (w) { return !used[type + "|" + L + "|" + w.en]; });
    var w = shuffle(fresh.length ? fresh : cands)[0];
    inQuiz[L + w.en] = 1;
    var q = MAKE[type](w, L, pool);
    q.lang = L; q.type = type; q.weight = WEIGHT[type]; q.pts = q.pts || 1; q.key = type + "|" + L + "|" + w.en;
    qs.push(q);
  });
  qs.forEach(function (q, i) { q.i = i; });
  qs.sort(function (a, b) { return a.weight - b.weight || a.i - b.i; });
  qs.forEach(function (q, i) { q.id = i; });
  return qs;
}
function score(q, a) {
  if (q.kind === "mc") return a === q.answer ? 1 : 0;
  if (q.kind === "text") return a && q.accept.indexOf(norm(a)) >= 0 ? 1 : 0;
  var n = 0; (a || []).forEach(function (v, r) { if (v === q.pairs[r].en) n++; }); return n;
}
function quizDays() {
  var all = addedDays();
  if (Q.days === "all") return all;
  return [parseInt(Q.days, 10)];
}

function showQuizSetup() {
  setBar(true);
  var have = addedDays();
  var lv = [1, 2, 3, 4].map(function (n) { return '<button type="button" class="pill" data-lv="' + n + '" aria-pressed="' + (Q.level === n) + '">Level ' + n + ' · ' + LEVELS[n] + '</button>'; }).join("");
  var dayOpts = '<option value="all"' + (Q.days === "all" ? " selected" : "") + '>All ready days (Day ' + have[0] + ' to ' + have[have.length - 1] + ')</option>' +
    have.map(function (d) { return '<option value="' + d + '"' + (String(Q.days) === String(d) ? " selected" : "") + '>Day ' + d + ' only · ' + esc(DAYS[d].theme) + '</option>'; }).join("");
  $("view").innerHTML =
    '<header class="hd"><div class="kicker">Four-language vocabulary quiz</div><h1>Quiz time</h1>' +
    '<p class="sub">Twelve questions across English, Tamil, French and Hindi, easy ones first. Answers stay hidden until you finish.</p></header>' +
    '<div class="card setup">' +
      '<div class="group"><span class="lbl">Difficulty</span><div class="chips" id="lvChips">' + lv + '</div></div>' +
      '<div class="group"><label class="lbl" for="qDays">Words from</label><select id="qDays">' + dayOpts + '</select></div>' +
      '<div class="group"><span class="lbl">How do you want to answer?</span><div class="chips" id="modeChips">' +
        '<button type="button" class="pill" data-mode="one" aria-pressed="' + (Q.mode === "one") + '">One question at a time</button>' +
        '<button type="button" class="pill" data-mode="all" aria-pressed="' + (Q.mode === "all") + '">All together</button></div></div>' +
      '<div><button type="button" class="pill solid" id="startQuiz">Start quiz</button></div>' +
    '</div>';
  $("lvChips").addEventListener("click", function (e) { var b = e.target.closest("[data-lv]"); if (!b) return; Q.level = parseInt(b.getAttribute("data-lv"), 10); [].forEach.call(this.children, function (c) { c.setAttribute("aria-pressed", c === b); }); });
  $("modeChips").addEventListener("click", function (e) { var b = e.target.closest("[data-mode]"); if (!b) return; Q.mode = b.getAttribute("data-mode"); [].forEach.call(this.children, function (c) { c.setAttribute("aria-pressed", c === b); }); });
  $("qDays").addEventListener("change", function () { Q.days = this.value; });
  $("startQuiz").addEventListener("click", startQuiz);
}
function startQuiz() { Q.qs = buildQuiz(Q.level, quizDays()); Q.ans = {}; Q.idx = 0; renderQuiz(); window.scrollTo(0, 0); }

function qHtml(q, n) {
  var a = Q.ans[q.id], body = "";
  if (q.kind === "mc") {
    body = '<div class="opts">' + q.opts.map(function (o, j) {
      var lang = q.optLang ? ' lang="' + q.optLang + '"' : "";
      return '<label class="opt"><input type="radio" name="q' + q.id + '" data-q="' + q.id + '" value="' + esc(o) + '"' + (a === o ? " checked" : "") + '><span' + lang + '>' + esc(o) + '</span></label>';
    }).join("") + '</div>';
  } else if (q.kind === "text") {
    body = '<input type="text" id="q' + q.id + '" data-q="' + q.id + '" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(a || "") + '" aria-label="Your answer">';
  } else {
    body = '<div class="mrows">' + q.pairs.map(function (p, r) {
      var cur = a && a[r] ? a[r] : "";
      return '<div class="mrow"><span class="big" lang="' + q.lang + '">' + esc(p[q.lang][0]) + '</span><select data-q="' + q.id + '" data-r="' + r + '" aria-label="Meaning of ' + esc(p[q.lang][0]) + '"><option value="">Choose…</option>' +
        q.opts.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? " selected" : "") + '>' + esc(o) + '</option>'; }).join("") + '</select></div>';
    }).join("") + '</div>';
  }
  return '<fieldset class="qcard"><legend class="qmeta"><span class="tag ' + q.lang + '-c">' + LANGS[q.lang].name + '</span><span>Question ' + (n + 1) + ' of ' + Q.qs.length + ' · ' + TYPE_LABEL[q.type] + '</span></legend>' +
    '<div class="qprompt">' + q.prompt + '</div>' + body + '</fieldset>';
}
function renderQuiz() {
  setBar(true);
  var qs = Q.qs, html = '<header class="hd"><div class="kicker">Level ' + Q.level + ' · ' + LEVELS[Q.level] + '</div><h1>Quiz</h1></header>';
  if (Q.mode === "one") {
    var last = Q.idx === qs.length - 1;
    html += qHtml(qs[Q.idx], Q.idx) + '<div class="pager"><button type="button" class="pill" id="qBack"' + (Q.idx === 0 ? " disabled" : "") + '>← Back</button>' +
      (last ? '<button type="button" class="pill solid" id="qSubmit">Submit answers</button>' : '<button type="button" class="pill solid" id="qNext">Next →</button>') + '</div>';
  } else {
    html += qs.map(function (q, n) { return qHtml(q, n); }).join("") + '<div class="pager"><span></span><button type="button" class="pill solid" id="qSubmit">Submit answers</button></div>';
  }
  $("view").innerHTML = html;
  var v = $("view");
  v.oninput = v.onchange = function (e) {
    var t = e.target, id = t.getAttribute("data-q"); if (id === null) return; id = parseInt(id, 10);
    if (t.hasAttribute("data-r")) { var arr = Q.ans[id] || (Q.ans[id] = []); arr[parseInt(t.getAttribute("data-r"), 10)] = t.value; }
    else Q.ans[id] = t.value;
  };
  if ($("qNext")) $("qNext").onclick = function () { Q.idx++; renderQuiz(); window.scrollTo(0, 0); };
  if ($("qBack")) $("qBack").onclick = function () { Q.idx--; renderQuiz(); window.scrollTo(0, 0); };
  if ($("qSubmit")) $("qSubmit").onclick = showResults;
}

function showResults() {
  var tot = 0, max = 0, per = {}, missed = {}, items = "";
  ORDER.forEach(function (L) { per[L] = { got: 0, max: 0 }; missed[L] = []; });
  var keys = [];
  Q.qs.forEach(function (q, n) {
    var a = Q.ans[q.id], got = score(q, a), mx = q.pts;
    tot += got; max += mx; per[q.lang].got += got; per[q.lang].max += mx; keys.push(q.key);
    var cls = got === mx ? "ok" : "no", st = got === mx ? "Correct" : (got > 0 ? "Partly correct (" + got + " of " + mx + ")" : "Not quite");
    if (got < mx) q.words.forEach(function (w) { if (missed[q.lang].indexOf(w) < 0) missed[q.lang].push(w); });
    var yours;
    if (q.kind === "match") yours = q.pairs.map(function (p, r) { var v = a && a[r] ? a[r] : "(blank)"; return esc(p[q.lang][0]) + " → " + esc(v) + (v === p.en ? " ✓" : " ✗ (" + esc(p.en) + ")"); }).join("<br>");
    else yours = esc(a ? a : "(no answer)");
    var ans = q.kind === "match" ? "" : '<div>Correct answer: <b>' + esc(q.answer) + '</b></div>';
    var sp = q.lang !== "en" && q.kind !== "match" ? spk(q.words[0][q.lang][0], q.lang, "Hear the " + LANGS[q.lang].name + " word", q.words[0].id + "-" + q.lang) : "";
    items += '<div class="rev ' + cls + '"><div class="st">' + (n + 1) + '. ' + LANGS[q.lang].name + ' · ' + st + '</div><div>' + q.prompt.replace(/<br>.*$/, "").replace(/<[^>]+>/g, "") + '</div>' +
      '<div>Your answer: ' + yours + '</div>' + ans + '<div class="ex">' + q.explain + '</div>' + sp + '</div>';
  });
  try { var u = usedSet(); keys.forEach(function (k) { u[k] = 1; }); store("dw_used", JSON.stringify(Object.keys(u).slice(-600))); } catch (e) {}
  var pct = max ? Math.round(tot * 100 / max) : 0;
  function f1(x) { return Math.round(x * 10) / 10; }
  var best = null, worst = null;
  ORDER.forEach(function (L) { var r = per[L].max ? per[L].got / per[L].max : 0; per[L].r = r; if (!best || r > per[best].r) best = L; if (!worst || r < per[worst].r) worst = L; });
  var langCards = ORDER.map(function (L) {
    var p = per[L], r = Math.round(p.r * 100);
    return '<div class="lscore"><span class="' + L + '-c" style="font-weight:600">' + LANGS[L].name + '</span><b>' + f1(p.got) + ' / ' + p.max + '</b><div class="meter" aria-hidden="true"><i style="width:' + r + '%"></i></div><span class="p">' + r + '%</span></div>';
  }).join("");
  var tips = [];
  ORDER.forEach(function (L) {
    if (missed[L].length) tips.push('<b>' + LANGS[L].name + ':</b> revise ' + missed[L].map(function (w) { return esc(nat(w, L)) + (L === "en" ? "" : " (" + esc(w.en) + ")"); }).join(", ") + '. Press the speaker and say each word aloud three times.');
  });
  if (!tips.length) tips.push("No mistakes this time. Try the next level.");
  tips.push("Use Slow speech on the lesson page to hear Tamil and Hindi sounds clearly.");
  tips.push("Write each word you missed five times, with its meaning, in a small notebook.");
  var band = pct >= 90 ? "Excellent work." : pct >= 75 ? "Good work." : pct >= 50 ? "Fair start. A little daily practice will lift this quickly." : "You need more practice. Go back to the daily lessons and try again.";
  var nextLv = pct >= 80 && Q.level < 4 ? Q.level + 1 : Q.level;
  var report = '<ul class="tips"><li>Level played: ' + Q.level + ' (' + LEVELS[Q.level] + '), ' + Q.qs.length + ' questions.</li>' +
    '<li>Strongest language: <b>' + LANGS[best].name + '</b>. Needs the most work: <b>' + LANGS[worst].name + '</b>' + (per[best].r === per[worst].r ? " (all four are level)" : "") + '.</li>' +
    '<li>' + band + (nextLv !== Q.level ? " You are ready for Level " + nextLv + "." : "") + '</li></ul>';
  setBar(true);
  $("view").innerHTML =
    '<header class="hd"><div class="kicker">Quiz result · Level ' + Q.level + ' ' + LEVELS[Q.level] + '</div><h1>Your score</h1></header>' +
    '<div class="card"><div class="score">' + f1(tot) + ' / ' + max + '</div><div class="sub">' + pct + '% overall</div></div>' +
    '<section><h2>Marks by language</h2><div class="langs">' + langCards + '</div></section>' +
    '<section><h2>Correct and incorrect answers</h2><div class="card">' + items + '</div></section>' +
    '<section><h2>How to improve</h2><div class="card"><ul class="tips">' + tips.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul></div></section>' +
    '<section><h2>Final performance report</h2><div class="card">' + report + '</div></section>' +
    '<div class="pager"><button type="button" class="pill" id="again">Same level, new questions</button>' +
    (nextLv !== Q.level ? '<button type="button" class="pill solid" id="nextLevel">Go to Level ' + nextLv + '</button>' : '<button type="button" class="pill solid" id="setupAgain">Change settings</button>') + '</div>';
  $("again").onclick = startQuiz;
  if ($("nextLevel")) $("nextLevel").onclick = function () { Q.level = nextLv; startQuiz(); };
  if ($("setupAgain")) $("setupAgain").onclick = showQuizSetup;
  window.scrollTo(0, 0);
}

/* ---------- start ---------- */
buildPicker();
window.addEventListener("hashchange", route);
if (synth) {
  if (synth.addEventListener) synth.addEventListener("voiceschanged", renderVoices); else synth.onvoiceschanged = renderVoices;
  setTimeout(renderVoices, 800);
}
route();
</script>
